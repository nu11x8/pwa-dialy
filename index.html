<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="d1">
<meta name="theme-color" content="#3d4fb0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>日記メモ</title>
<style>
  :root { --bg:#f5f6fb; --fg:#1c2033; --card:#fff; --line:#d9ddee; --muted:#5f6684; --accent:#3d4fb0; --on-accent:#fff; --chip:#eceffa; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141f; --fg:#e8eaf5; --card:#1b1e2d; --line:#333852; --muted:#a0a7c6; --accent:#8c9bf0; --on-accent:#10142e; --chip:#252a40; --err:#f2938d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size:1.25rem; margin:8px 0 4px; }
  #dateLabel { margin:0 0 16px; color:var(--muted); font-size:.95rem; }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; grid-template-columns:minmax(0,1fr); gap:18px; }
  .field { display:grid; gap:6px; min-width:0; }
  .field > span, legend { font-size:.9rem; font-weight:600; }
  legend small { font-weight:400; color:var(--muted); }
  fieldset { border:0; padding:0; margin:0; display:grid; gap:8px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  input, textarea { font:inherit; width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  input[type="time"] { -webkit-appearance:none; appearance:none; display:block; min-width:0; min-height:2.8rem; text-align:left; }
  input[type="time"]::-webkit-date-and-time-value { text-align:left; }
  textarea { resize:vertical; line-height:1.6; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .scale { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .chip { font:inherit; font-size:1.1rem; padding:12px 0; border:1px solid var(--line); border-radius:10px; background:var(--chip); color:var(--fg); cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:700; }
  .btn { font:inherit; font-weight:600; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .btn.copy { justify-self:end; color:var(--accent); border-color:var(--accent); }
  #status { min-height:1.5em; margin:12px 2px 0; font-size:.9rem; color:var(--accent); }
  #status.err { color:var(--err); }
  .hint { margin:4px 2px; font-size:.8rem; color:var(--muted); }
  .pending-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:8px 2px; font-size:.85rem; color:var(--muted); }
  .pending-row .btn { padding:6px 12px; font-size:.85rem; }
  .ver { font-size:.7rem; color:var(--muted); margin:16px 2px 0; }
</style>
</head>
<body>
<main>
  <h1>日記</h1>
  <p id="dateLabel"></p>

  <form id="form" novalidate onsubmit="return false">
    <div class="two">
      <label class="field"><span>入眠</span><input type="time" id="sleep"></label>
      <label class="field"><span>起床</span><input type="time" id="wake"></label>
    </div>

    <fieldset><legend>気分 <small>1 悪い 〜 5 良い</small></legend><div class="scale" id="mood"></div></fieldset>
    <fieldset><legend>体調 <small>1 悪い 〜 5 良い</small></legend><div class="scale" id="health"></div></fieldset>

    <label class="field"><span>日記</span><textarea id="diary" rows="10"></textarea></label>
    <button type="button" class="btn copy" id="copy">日記をコピー</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <p class="hint">入力は自動で端末に保存されます。日付が変わると前日分をシートに送信します。</p>
  <div class="pending-row">
    <span id="pending"></span>
    <button type="button" class="btn" id="flushNow" hidden>今すぐ送信</button>
    <button type="button" class="btn" id="sendToday">今日分を今すぐ送信（動作確認用）</button>
  </div>
  <p class="ver" id="ver"></p>
</main>

<script>
// ▼ 設置時にここを書き換える ▼
const GAS_URL = "ここにApps ScriptのウェブアプリURLを貼る"; // 末尾が /exec のURL
const SECRET  = "change-me";                              // Code.gs の SECRET と同じ値
// ▲ ここまで ▲

const KEY = "diary-entries"; // { "2026-10-01": {sleep, wake, mood, health, diary, updatedAt, sent} }
const $ = id => document.getElementById(id);
const read = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const dirty = e => e.sent !== e.updatedAt; // 最後に送った版と違えば未送信
function setStatus(msg, isErr = false) { $("status").textContent = msg; $("status").className = isErr ? "err" : ""; }

let curDate = today();
const vals = { mood: 3, health: 3 };

/* ---------- 気分・体調ボタン ---------- */
function buildScale(id) {
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = n; b.dataset.n = n;
    b.onclick = () => { vals[id] = n; paintScale(id); save(); };
    $(id).appendChild(b);
  }
}
const paintScale = id => [...$(id).children].forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.n) === vals[id])));

/* ---------- 端末への保存（その日のうちは何度でも上書き） ---------- */
function loadForm() {
  const e = read(KEY, {})[curDate] || {};
  $("sleep").value = e.sleep || ""; $("wake").value = e.wake || ""; $("diary").value = e.diary || "";
  vals.mood = e.mood || 3; vals.health = e.health || 3;
  paintScale("mood"); paintScale("health");
  $("dateLabel").textContent = new Date(curDate + "T00:00:00")
    .toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
}
function save() {
  const all = read(KEY, {});
  all[curDate] = { sleep: $("sleep").value, wake: $("wake").value, mood: vals.mood, health: vals.health,
    diary: $("diary").value, updatedAt: Date.now(), sent: all[curDate]?.sent };
  write(KEY, all);
  setStatus("端末に保存しました"); showPending();
}
["sleep", "wake", "diary"].forEach(id => $(id).addEventListener("input", save));

/* ---------- クリップボードにコピー ---------- */
$("copy").onclick = async () => {
  const t = $("diary").value;
  if (!t) { setStatus("コピーする日記がありません", true); return; }
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; }
  catch { try { $("diary").select(); ok = document.execCommand("copy"); } catch {} }
  setStatus(ok ? "日記をコピーしました" : "コピーできませんでした", !ok);
};

/* ---------- シートへ送信 ---------- */
let flushing = false, updatePending = false, lastError = "";
const pendingDates = (includeToday = false) => {
  const all = read(KEY, {});
  return Object.keys(all).filter(d => (includeToday || d < curDate) && dirty(all[d])).sort();
};
function showPending() {
  const n = pendingDates().length;
  $("pending").textContent = n ? `未送信の前日以前の分: ${n}日` : "";
  $("flushNow").hidden = !n;
}
async function postRows(rows, keepalive) {
  // 一時的な失敗に備え1回だけ再試行（閉じるときは除く）。GAS側は日付で上書きするので二重登録にならない。
  for (let i = 0; i < (keepalive ? 1 : 2); i++) {
    let res = null;
    try {
      // Content-Type を指定しない（text/plain）ことで CORS プリフライトを避ける
      res = await fetch(GAS_URL, { method: "POST", keepalive, body: JSON.stringify({ secret: SECRET, rows }) });
    } catch (e) { lastError = `通信に失敗しました（${e.message || e.name}）`; }
    if (res) {
      try {
        const json = await res.json();
        if (json.ok === true) return true;
        lastError = json.error === "unauthorized" ? "SECRETがGAS側と一致しません" : String(json.error || "不明なエラー");
        return false;
      } catch { lastError = `GASの応答を読み取れませんでした（HTTP ${res.status}）`; }
    }
    if (!keepalive && i === 0) await new Promise(r => setTimeout(r, 1500));
  }
  return false;
}
async function flushQueue(manual = false, keepalive = false, includeToday = false) {
  if (flushing || !navigator.onLine) return;
  const dates = pendingDates(includeToday);
  if (!dates.length) { if (manual) setStatus("送信するデータはありません"); return; }
  flushing = true;
  if (manual) setStatus("送信中…");
  let sent = 0;
  for (let i = 0; i < dates.length; i += 50) {
    const chunk = dates.slice(i, i + 50), all = read(KEY, {});
    const rows = chunk.map(d => { const e = all[d];
      return { date: d, sleep: e.sleep, wake: e.wake, mood: e.mood, health: e.health, diary: e.diary, sentAt: new Date().toISOString() }; });
    const vers = chunk.map(d => all[d].updatedAt);
    if (!(await postRows(rows, keepalive))) break;
    const cur = read(KEY, {});
    chunk.forEach((d, j) => { if (cur[d]) cur[d].sent = vers[j]; });
    write(KEY, cur); sent += chunk.length;
  }
  flushing = false;
  showPending();
  if (sent) setStatus(`${sent}日分をシートに送信しました`);
  else if (!keepalive) setStatus("送信できませんでした: " + lastError, true);
  maybeReload();
}
$("flushNow").onclick = () => flushQueue(true);
$("sendToday").onclick = () => flushQueue(true, false, true);

/* ---------- 日付の切り替わり ---------- */
function tick() {
  const t = today();
  if (t !== curDate) { curDate = t; loadForm(); setStatus("日付が変わりました。前日分を送信します"); }
  flushQueue();
}
setInterval(tick, 30000);
window.addEventListener("online", tick);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushQueue(false, true);
  else { tick(); checkUpdate(); }
});
window.addEventListener("pagehide", () => flushQueue(false, true));

buildScale("mood"); buildScale("health"); loadForm(); showPending(); flushQueue();

/* ---------- 自動アップデート ---------- */
// 起動時とアプリに戻ったときに index.html の版を確認し、新しければ読み込み直す。
// 入力は端末に保存済みなので、再読み込みしても失われない。日記を入力中は待つ。
const APP_VERSION = document.querySelector('meta[name="app-version"]').content;
$("ver").textContent = "app " + APP_VERSION;
function maybeReload() {
  if (!updatePending || flushing) return;
  if (document.activeElement === $("diary")) return;
  location.reload();
}
$("diary").addEventListener("blur", maybeReload);
async function checkUpdate() {
  if (!navigator.onLine) return;
  try {
    const res = await fetch("index.html?_=" + Date.now(), { cache: "no-store" });
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const remote = doc.querySelector('meta[name="app-version"]')?.content;
    if (!remote || remote === APP_VERSION) return;
    let tried = null;
    try { tried = sessionStorage.getItem("update-tried"); } catch {}
    if (tried === remote) { setStatus("新しいバージョンがあります。アプリを一度閉じて開き直してください"); return; } // 再読み込みの繰り返し防止
    try { sessionStorage.setItem("update-tried", remote); } catch {}
    updatePending = true;
    maybeReload();
  } catch {}
}
checkUpdate();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(console.error);
</script>
</body>
</html>
